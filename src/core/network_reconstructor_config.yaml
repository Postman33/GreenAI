# Параметры геометрического восстановления небольших разрывов в уже очищенных
# инженерных сетях. Значения с суффиксом _m задаются в метрах и при запуске
# умножаются на --dxf-units-per-meter.
defaults:
  # Концы ближе этого расстояния уже считаются соединёнными.
  snap_tolerance_m: 0.05

  # Максимальный разрыв между двумя почти коллинеарными продолжениями трассы.
  max_gap_m: 5.0

  # Максимальное отклонение соединителя от направления каждого продолжения.
  max_angle_deg: 12.0

  # Порог автоматического принятия и нижний порог вывода кандидата на проверку.
  accept_score: 0.58
  review_score: 0.38

  # Разрешить подключение свободного конца к середине другой линии (тройник).
  enable_junctions: true
  max_junction_gap_m: 2.0
  max_junction_angle_deg: 18.0
  junction_interior_margin_m: 0.10

  # Параллельные линии могут быть двумя границами широкой трубы. Они остаются
  # отдельными, а две согласованные пары продолжений усиливают друг друга.
  parallel_support_enabled: true
  parallel_pipe_max_width_m: 6.0
  parallel_gap_difference_m: 0.75
  parallel_direction_difference_deg: 5.0
  parallel_support_bonus: 0.08

  # Несколько почти равноценных продолжений одного конца допустимы: это может
  # быть переход к двум границам широкой трубы. Сохраняем до трёх вариантов,
  # если их score отличается от лучшего не больше указанной величины.
  allow_ambiguous_continuations: true
  max_connections_per_endpoint: 3
  ambiguous_score_delta: 0.12

# Здесь можно переопределять параметры отдельно для каждого типа сети.
network_types:
  gas_pipe: {}
  water_pipe: {}
  heat_pipe: {}
  power_cable:
    # The cleaned cable geometry is retained, but it is not used by an automatic
    # placement rule yet. Avoid the expensive gap search across tens of thousands
    # of graphical fragments until the cable rule is approved.
    reconstruction_enabled: false
  sewer_pipe: {}
  storm_drain: {}
  telecom_cable: {}
  overhead_power_line:
    # Для ЛЭП направление по разрозненным стрелкам пока нельзя считать
    # подтверждённой геометрией линии.
    max_gap_m: 0.0
    enable_junctions: false
