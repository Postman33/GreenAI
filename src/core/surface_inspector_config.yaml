# Отдельный диагностический профиль. Он намеренно выбирает все HATCH и
# LWPOLYLINE, чтобы найти площадные покрытия, ещё не описанные в config.yaml.

geobase_blocks:
  name_regex:
    - "^3_ДЖКХ"
    - "^3ДЖКХ"
    - "^Заводский_пр_3_ДЖКХ"
    - "^Гео[._]"
    - "^XREF_ИГДИ_"
    - "^xref_БУ_"
    - "^Собранная ГЕО$"
    - "^01_Бортовые камни$"
    - "^02_Покрытия$"
    - '^\d{2}\.\d+_\d+_Топография$'
    - '^\d{2}\.\d+_\d+_Сети$'
    - '^\d{2}_\d+_Границы работ$'
    # General-plan exports can keep carriageway, sidewalk and lawn HATCHes in
    # one bound project block. Expand it only for surface classification: the
    # semantic loader intentionally excludes it so proposed utilities and
    # annotations are not confused with the existing survey.
    - '^\d{2}_\d+_Проектные решения$'
  max_depth: 12

layer_mapping:
  surface_candidate_modelspace:
    semantic_type: surface_candidate
    source: modelspace
    required: false
    layer_regex: ".*"
    dxf_types: [HATCH, LWPOLYLINE]
    geometry: polygon_candidate
    conversion: inspect_closed_surface

  surface_candidate_geobase:
    semantic_type: surface_candidate
    source: geobase_blocks
    required: false
    layer_regex: ".*"
    dxf_types: [HATCH, LWPOLYLINE]
    geometry: polygon_candidate
    conversion: inspect_closed_surface
