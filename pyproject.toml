[project]
name = "green-cad-planner"
version = "0.1.0"
description = "DXF-based utility detection and urban planting planner"
authors = [{ name = "Hackathon Team" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "ezdxf>=1.3,<2",
    "PyYAML>=6,<7",
    "shapely>=2,<3",
    "matplotlib>=3.8,<4",
    "psycopg[binary]>=3.2,<4",
    "numpy>=2,<3",
    "scikit-learn>=1.6,<2",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<1.24",
    "skl2onnx>=1.18,<2",
    "reportlab>=4.2,<5",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
