services:
  postgis:
    image: postgis/postgis:17-3.5
    container_name: greening-postgis
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: admin
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    build:
      context: .
    profiles: ["tools"]
    entrypoint: ["python", "/app/scripts/seed.py"]
    environment:
      DATABASE_URL: postgresql://admin:admin@postgis:5432/admin
    depends_on:
      postgis:
        condition: service_healthy

  planner:
    build:
      context: .
    profiles: ["pipeline"]
    environment:
      DATABASE_URL: postgresql://admin:admin@postgis:5432/admin
      DXF_UNITS_PER_METER: ${DXF_UNITS_PER_METER:-1.0}
    volumes:
      - ${GREENAI_DATA_DIR:-./docker-data}:/data
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  postgis_data:
