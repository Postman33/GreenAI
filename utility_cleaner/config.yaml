# Эвристики очистки линейных инженерных сетей.
# Все расстояния заданы в метрах и умножаются на --dxf-units-per-meter.

defaults:
  # Примитивы короче этого значения считаются штрихами оформления.
  min_fragment_length_m: 0.40
  # Длинные примитивы образуют первичный скелет предполагаемой трассы.
  min_seed_length_m: 8.00
  # Отношение расстояния между концами к длине. У дуг букв и стрелок оно
  # заметно меньше единицы; почти прямые участки трасс проходят этот фильтр.
  min_seed_straightness: 0.92
  # Скелет сохраняется только как достаточно длинный и протяжённый компонент.
  min_component_length_m: 20.00
  min_component_span_m: 15.00
  # Допуск соединения концов и пересечений соседних CAD-примитивов.
  connect_tolerance_m: 0.20
  # Маленькие замкнутые контуры обычно являются буквами и условными знаками.
  max_compact_closed_span_m: 8.00
  # Короткий фрагмент можно вернуть, только если оба его конца касаются скелета.
  max_connector_length_m: 10.00
  # Постфильтр наконечников стрелок: две короткие линии сходной длины,
  # выходящие из общей точки под острым углом.
  max_arrow_leg_length_m: 14.00
  min_arrow_leg_length_ratio: 0.65
  min_arrow_angle_deg: 12.00
  max_arrow_angle_deg: 75.00
  # Стрелка-выноска может состоять из длинного хвоста и одного короткого уса.
  max_arrow_barb_length_m: 6.00
  max_arrow_shaft_length_m: 35.00
  max_arrow_barb_angle_deg: 55.00
  # В высокий уровень уверенности попадает очень длинный одиночный сегмент
  # либо цепочка сегментов, продолжающихся почти по прямой. Одиночные боковые
  # ветви сохраняются отдельно для ручной проверки.
  # Одиночная длинная линия может быть выноской к подписи. Поэтому по
  # умолчанию одной длины недостаточно: требуется коллинеарное продолжение.
  allow_isolated_long_strokes: false
  min_high_confidence_single_length_m: 30.00
  min_straight_continuation_angle_deg: 150.00

network_types:
  water_pipe:
    enabled: true
  storm_drain:
    enabled: true
  gas_pipe:
    enabled: true
  heat_pipe:
    enabled: true
    min_seed_length_m: 6.00
    min_component_length_m: 16.00
    min_component_span_m: 12.00
  sewer_pipe:
    enabled: true
  power_cable:
    enabled: true
  telecom_cable:
    enabled: true
  overhead_power_line:
    enabled: false
    reason: >-
      В проверочном DXF ЛЭП состоит из несвязанных штрихов длиной около 2,5 м.
      Для восстановления оси нужен отдельный алгоритм группировки коллинеарных
      штрихов и подтверждение класса напряжения.
